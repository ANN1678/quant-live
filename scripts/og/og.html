<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<!-- og.png の版下。1200x630 で撮る。作り直し方は README の「共有画像」を見ること。
     ⚠ サイトの正本 src/styles/global.css と同じ値で書く。ここだけ別の書体・太さにしない。 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=block">
<style>
  :root{
    --paper:#fbfbfa; --ink:#0a0a0a; --muted:#6b6a65; --rule:rgba(10,10,10,.13);
    --sans:"Inter","Zen Kaku Gothic New","Hiragino Sans",sans-serif;
  }
  *{box-sizing:border-box;margin:0}
  html,body{width:1200px;height:630px}
  body{
    background:var(--paper); color:var(--ink); font-family:var(--sans);
    display:flex; flex-direction:column; padding:56px 68px 60px;
    -webkit-font-smoothing:antialiased;
  }
  .top{display:flex;align-items:center;justify-content:space-between;padding-bottom:26px;border-bottom:1px solid var(--rule)}
  .brand{display:flex;align-items:center;gap:14px;font-weight:700;font-size:28px;letter-spacing:.05em}
  .url{font-size:17px;letter-spacing:.09em;color:var(--muted)}
  h1{font-size:66px;font-weight:500;line-height:1.16;letter-spacing:-.028em;margin-top:56px}
  .lead{margin-top:24px;font-size:22px;line-height:1.7;color:var(--ink)}
  .stats{margin-top:auto;display:grid;grid-template-columns:repeat(3,1fr);column-gap:44px}
  .stat{border-top:1px solid var(--ink);padding-top:14px}
  .stat .v{font-size:30px;line-height:1.2;font-weight:500;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .stat .k{margin-top:6px;font-size:16px;color:var(--muted)}
</style></head>
<body>
  <div class="top">
    <div class="brand">
      <svg width="38" height="33" viewBox="0 0 100 88" aria-hidden="true">
        <mask id="m"><rect width="100" height="88" fill="#fff"/><path fill="#000" d="M44.51 44.6H55.61L54.949999999999996 41.6H45.199999999999996ZM50.0 34.94 53.36 42.74 53.42 43.61 56.269999999999996 50.0H60.29L50.0 27.830000000000002L39.74 50.0H43.73L46.64 43.43L46.699999999999996 42.65Z M43.18 57.0V71.1L27.85 55.95V78.0H31.330000000000002V63.9L46.66 79.05V57.0Z M67.67 57.0V71.1L52.34 55.95V78.0H55.82V63.9L71.15 79.05V57.0Z"/></mask>
        <path fill="#0a0a0a" mask="url(#m)" d="M50 4 L96 84 L4 84 Z"/>
      </svg>
      ANN
    </div>
    <div class="url">ann1678.com</div>
  </div>

  <h1>相場を予測して、<br>仮想で売買しています。</h1>
  <p class="lead">当たった回も、外した回も、そのまま出します。</p>

  <div class="stats">
    <div class="stat"><div class="v">BTC / ETH</div><div class="k">銘柄</div></div>
    <div class="stat"><div class="v">72H</div><div class="k">予測する先</div></div>
    <div class="stat"><div class="v">1H</div><div class="k">書き換える間隔</div></div>
  </div>
</body></html>
