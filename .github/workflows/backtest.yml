name: 過去への当てはめを取り直す

on:
  schedule:
    - cron: '20 20 * * 0'   # 毎週月曜 5:20 JST
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    # 4年ぶんは1銘柄 1,460 リクエスト。ふだん 10 分前後
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python engine/backtest.py
      - run: |
          git config user.name "quant-live"
          git config user.email "info@ann1678.com"
          git add data/backtest.json
          if ! git diff --cached --quiet; then
            git commit -m "過去への当てはめを取り直した"
            pushed=0
            for i in 1 2 3; do
              if git pull --rebase origin main && git push; then pushed=1; break; fi
              git rebase --abort 2>/dev/null || true
              echo "push できなかった（${i}回目）。取り込み直す"; sleep 5
            done
            if [ "$pushed" != 1 ]; then
              echo "::error::3回とも push できなかった。この回の記録は残っていない"; exit 1
            fi
          fi
