name: 予測を出して記録する

on:
  # ⚠ **これは予備です。本命は Xserver の cron から叩く workflow_dispatch。**
  #    GitHubの予定実行は来ません。2026-09-12の実測で 80.3時間に22回（27%）でした。
  #    分を動かしても変わりません（:05 で28%、:37 で27%）。GitHub側の後回しなので、こちらでは直せない。
  #    合図は ops/dispatch.sh がサーバーから毎時出します。こちらは、そのサーバーが止まったときの保険です。
  #
  #    毎時5分（UTC）。合図の時刻を足が閉じた直後に寄せてある。
  #    予測の材料は「前の1時間の足」なので、:37 まで待つ意味が無い。待つと建て値が足の終値から離れる。
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch:

# 同時に走らせない。走らせると同じ予測が二重に入る。
concurrency:
  group: engine
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # bitbank が長く黙ると 1 URL に最大 66 秒かかる。60 URL で 1 時間を超えないように区切る
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: エンジンを回す
        run: python engine/run.py
      - name: 記録を残す
        # ⚠ push の前に必ず取り込む。checkout から push までの間に人が src/ を push すると弾かれ、
        #    その回の記録が消える（data/ は Actions しか書かないので rebase で衝突しない）。
        run: |
          git config user.name "quant-live"
          git config user.email "info@ann1678.com"
          git add data/
          if git diff --cached --quiet; then
            echo "変わっていないので何もしない"
          else
            git commit -m "記録 $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')"
            pushed=0
            for i in 1 2 3; do
              if git pull --rebase origin main && git push; then pushed=1; break; fi
              git rebase --abort 2>/dev/null || true
              echo "push できなかった（${i}回目）。取り込み直す"; sleep 5
            done
            if [ "$pushed" != 1 ]; then
              echo "::error::3回とも push できなかった。この回の記録は残っていない"; exit 1
            fi
          fi

  deploy:
    needs: run
    permissions:
      contents: write
    uses: ./.github/workflows/deploy.yml
