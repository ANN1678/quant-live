name: 予測を出して記録する

on:
  schedule:
    # 毎時5分（UTC）。GitHubの都合で数分ずれることがある。
    - cron: '5 * * * *'
  workflow_dispatch:

# 同時に走らせない。走らせると同じ予測が二重に入る。
concurrency:
  group: engine
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: エンジンを回す
        run: python engine/run.py
      - name: 記録を残す
        run: |
          git config user.name "quant-live"
          git config user.email "info@ann1678.com"
          git add data/
          if git diff --cached --quiet; then
            echo "変わっていないので何もしない"
          else
            git commit -m "記録 $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')"
            git push
          fi

  deploy:
    needs: run
    permissions:
      contents: write
    uses: ./.github/workflows/deploy.yml

  # 外形チェックは最後に、別のジョブでやる。
  # ⚠ 検査が本業を止めてはいけない。2026-09-08にこれを記録より前へ置いて、
  #    チェックが1回タイムアウトしただけでその回の予測が保存されなかった。
  alive:
    needs: [run, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: 本番が生きているか外から見る
        run: |
          for i in 1 2 3 4 5; do
            code=$(curl -sS -o /tmp/live.html -m 45 --retry 2 --retry-delay 5 \
                        -A 'quant-live-uptime/1.0 (+https://ann1678.com/)' \
                        -w '%{http_code}' https://ann1678.com/ || echo 000)
            echo "試行 ${i}: HTTP ${code}"
            if [ "${code}" = "200" ] && grep -q 'ann-render-ok' /tmp/live.html; then
              echo "生きている"; exit 0
            fi
            sleep 20
          done
          echo "::error::ann1678.com に5回届かなかった（または中身の印が無い）"
          exit 1
